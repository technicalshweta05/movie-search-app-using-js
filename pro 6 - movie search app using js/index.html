<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSearch | Movie Search App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 40px 20px;
}

.container{
    max-width: 1280px;
    margin: auto;
}

.header{
    text-align: center;
    margin-bottom: 40px;
}

.header h1{
    font-size: 48px;
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 8px;
}

.header h1 i{
    margin-right: 12px;
}

.header p{
    color: #94a3b8;
    font-size: 18px;
}

form{
    display: flex;
    gap: 12px;
    margin-bottom: 40px;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 12px;
    border-radius: 12px;
}

.search-wrapper{
    position: relative;
    flex-basis: 100%;
}

.search-wrapper i{
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
}

form input{
    width: 100%;
    height: 54px;
    padding: 0 20px 0 50px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    outline: none;
    color: #fff;
    font-size: 16px;
}

form input::placeholder{
    color: #64748b;
}

form button{
    padding: 0 32px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    font-weight: 600;
    font-size: 16px;
    transition: 0.3s;
}

form button i{
    margin-right: 8px;
}

form button:hover{
    background: #0ea5e9;
}

.message{
    text-align: center;
    font-size: 18px;
    margin-bottom: 30px;
    color: #fbbf24;
    min-height: 28px;
}

.message i{
    margin-right: 8px;
}

.movieGrid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
}

.movieCard{
    background: #1e293b;
    border: 1px solid #334155;
    overflow: hidden;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
}

.movieCard:hover{
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
}

.movieCard img{
    width: 100%;
    height: 380px;
    object-fit: cover;
    display: block;
}

.ratingBadge{
    position: absolute;
    top: 12px;
    right: 12px;
    background: #f59e0b;
    color: #0f172a;
    padding: 6px 10px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
}

.ratingBadge i{
    margin-right: 4px;
}

.movieInfo{
    padding: 16px;
}

.movieInfo h3{
    font-size: 18px;
    margin-bottom: 6px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.movieMeta{
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 8px;
}

.movieMeta i{
    margin-right: 6px;
}

.genre{
    color: #38bdf8;
    font-size: 14px;
    margin-bottom: 10px;
}

.genre i{
    margin-right: 6px;
}

.plot{
    color: #cbd5e1;
    font-size: 14px;
    line-height: 21px;
    height: 60px;
    overflow: hidden;
}

.loadingBox{
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #334155;
}

.loadingImg{
    height: 380px;
    background: #334155;
}

.loadingText{
    height: 16px;
    background: #334155;
    border-radius: 4px;
    margin: 12px 16px;
}

@media only screen and (min-width: 200px) and (max-width: 575px){
    body{
        padding: 20px 12px;
    }

  .header{
        margin-bottom: 24px;
    }

  .header h1{
        font-size: 29px;
    }

  .header h1 i{
        margin-right: 8px;
    }

  .header p{
        font-size: 14px;
    }

    form{
        flex-direction: column;
        padding: 12px;
        gap: 10px;
        margin-bottom: 24px;
    }

    form input{
        height: 48px;
        font-size: 14px;
        padding: 0 16px 0 45px;
    }

  .search-wrapper i{
        left: 16px;
        font-size: 14px;
    }

    form button{
        height: 48px;
        padding: 0 20px;
        font-size: 14px;
    }

  .message{
        font-size: 16px;
        margin-bottom: 20px;
    }

  .movieGrid{
        grid-template-columns: 1fr;
        gap: 16px;
    }

  .movieCard img{
        height: 320px;
    }

  .ratingBadge{
        top: 8px;
        right: 8px;
        padding: 4px 8px;
        font-size: 13px;
    }

  .movieInfo{
        padding: 12px;
    }

  .movieInfo h3{
        font-size: 16px;
    }

  .movieMeta{
        font-size: 13px;
    }

  .genre{
        font-size: 13px;
    }

  .plot{
        font-size: 13px;
        height: 54px;
        line-height: 18px;
    }

  .loadingImg{
        height: 320px;
    }
}

@media only screen and (min-width: 576px) and (max-width: 991px){
    body{
        padding: 30px 16px;
    }

  .header h1{
        font-size: 38px;
    }

  .header p{
        font-size: 16px;
    }

    form{
        padding: 14px;
        gap: 12px;
    }

    form input{
        height: 50px;
    }

    form button{
        padding: 0 28px;
        height: 50px;
    }

  .movieGrid{
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

  .movieCard img{
        height: 350px;
    }

  .movieInfo{
        padding: 14px;
    }

  .plot{
        height: 58px;
    }

  .loadingImg{
        height: 350px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-film"></i>CineSearch</h1>
            <p>Discover your next favorite movie</p>
        </div>

        <form>
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" name="movieName" placeholder="Search for Avengers, Inception, Batman...">
            </div>
            <button type="submit"><i class="fa-solid fa-search"></i>Search</button>
        </form>

        <div class="message" id="message"></div>
        <div class="movieGrid" id="movieGrid"></div>
    </div>

<script>
let form = document.querySelector("form");
let movieGrid = document.querySelector("#movieGrid");
let message = document.querySelector("#message");

const API_KEY = "9f14812e";
const placeholderImage = "https://via.placeholder.com/300x450/1e293b/64748b?text=No+Poster";

loadRandomMovies();

async function loadRandomMovies(){
    let keywords = ["Avengers", "Batman", "Inception", "Titanic", "Matrix", "Frozen", "Joker", "Avatar", "Shrek", "Gladiator"];

    message.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>Loading movies...';
    movieGrid.innerHTML = "";

    try{
        
        let searchPromises = keywords.map(keyword =>
            fetch("https://www.omdbapi.com/?s=" + keyword + "&apikey=" + API_KEY).then(res => res.json())
        );

        let searchResults = await Promise.all(searchPromises);
        let allMovies = searchResults.filter(r => r.Response == "True").map(r => r.Search[0]);

       
        let detailPromises = allMovies.map(movie =>
            fetch("https://www.omdbapi.com/?i=" + movie.imdbID + "&apikey=" + API_KEY).then(res => res.json())
        );

        let movieDetailsList = await Promise.all(detailPromises);

        message.innerHTML = '<i class="fa-solid fa-check"></i>Found 10 random movies';

        for(let i = 0; i < movieDetailsList.length; i++){
            let movieDetails = movieDetailsList[i];
            let poster = movieDetails.Poster == "N/A"? placeholderImage : movieDetails.Poster;
            let rating = movieDetails.imdbRating!== "N/A"? movieDetails.imdbRating : "-";

            movieGrid.innerHTML += `
            <div class="movieCard">
                <img src="${poster}" alt="${movieDetails.Title}">
                <span class="ratingBadge"><i class="fa-solid fa-star"></i>${rating}</span>
                <div class="movieInfo">
                    <h3>${movieDetails.Title}</h3>
                    <p class="movieMeta"><i class="fa-solid fa-calendar"></i>${movieDetails.Year} • <i class="fa-solid fa-clock"></i>${movieDetails.Runtime}</p>
                    <p class="genre"><i class="fa-solid fa-masks-theater"></i>${movieDetails.Genre}</p>
                    <p class="plot">${movieDetails.Plot}</p>
                </div>
            `;
        }

    } catch(error){
        console.log(error);
        message.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>Something went wrong. Try again.';
    }
}

form.addEventListener("submit", function(event) {
    event.preventDefault();
    let movieName = event.target.movieName.value.trim();

    if(movieName == ""){
        message.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>Please enter a movie name';
        movieGrid.innerHTML = "";
        return;
    }
    loadMovies(movieName);
});

async function loadMovies(movieName){
    let loadingHTML = "";
    for(let i = 0; i < 8; i++){
        loadingHTML += `
            <div class="loadingBox">
                <div class="loadingImg"></div>
                <div class="loadingText" style="width: 80%;"></div>
                <div class="loadingText" style="width: 50%;"></div>
            </div>
        `;
    }
    movieGrid.innerHTML = loadingHTML;
    message.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>Searching...';

    try{
        let fetchData = await fetch("https://www.omdbapi.com/?s=" + movieName + "&apikey=" + API_KEY);
        let finalRes = await fetchData.json();

        if(finalRes.Response == "False"){
            message.innerHTML = '<i class="fa-solid fa-face-sad-tear"></i>No movies found for "' + movieName + '"';
            movieGrid.innerHTML = "";
            return;
        }

        message.innerHTML = '<i class="fa-solid fa-check"></i>Found ' + finalRes.Search.length + ' results';
        let movies = finalRes.Search;
        movieGrid.innerHTML = "";

        for(let i = 0; i < movies.length; i++){
            let movie = movies[i];
            let detailFetch = await fetch("https://www.omdbapi.com/?i=" + movie.imdbID + "&apikey=" + API_KEY);
            let movieDetails = await detailFetch.json();

            let poster = movieDetails.Poster == "N/A"? placeholderImage : movieDetails.Poster;
            let rating = movieDetails.imdbRating!== "N/A"? movieDetails.imdbRating : "-";

            movieGrid.innerHTML += `
            <div class="movieCard">
                <img src="${poster}" alt="${movieDetails.Title}">
                <span class="ratingBadge"><i class="fa-solid fa-star"></i>${rating}</span>
                <div class="movieInfo">
                    <h3>${movieDetails.Title}</h3>
                    <p class="movieMeta"><i class="fa-solid fa-calendar"></i>${movieDetails.Year} • <i class="fa-solid fa-clock"></i>${movieDetails.Runtime}</p>
                    <p class="genre"><i class="fa-solid fa-masks-theater"></i>${movieDetails.Genre}</p>
                    <p class="plot">${movieDetails.Plot}</p>
                </div>
            </div>
            `;
        }

    } catch(error){
        console.log(error);
        message.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>Something went wrong. Try again.';
    }
}
</script>
</body>
</html>
